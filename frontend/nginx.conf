server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's embedded DNS. Required because the proxy_pass targets
    # below are built from a captured variable (node1, node2, ...) instead of a
    # static upstream, so nginx resolves the hostname per request.
    resolver 127.0.0.11 valid=10s;

    # One pair of rules proxies every node, so adding nodes needs no change here.
    # /api/node<N>/events is the SSE stream: buffering off, long read timeout.
    location ~ ^/api/node(\d+)/events/?$ {
        proxy_pass http://node$1:5000/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        add_header Access-Control-Allow-Origin *;
    }

    # Every other /api/node<N>/* call is a short request/response.
    location ~ ^/api/node(\d+)/(.*)$ {
        proxy_pass http://node$1:5000/$2$is_args$args;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
